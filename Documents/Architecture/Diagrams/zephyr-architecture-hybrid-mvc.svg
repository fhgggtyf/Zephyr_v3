<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Zephyr 混合架构：整体分层组件化，UI 局部 MVC/MVP</title>
  <desc id="desc">展示 Zephyr 不是传统 MVC，而是以生命周期和领域边界为核心的 Unity 分层组件架构；UI 子系统局部采用 MVC 或 MVP 风格。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="domain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 32px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .label{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:400 13px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .tiny{font:400 12px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .pill{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .arrow-label{font:600 13px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="984" rx="22" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="80" y="84" class="title">Zephyr 架构定位</text>
  <text x="80" y="116" class="subtitle">整体不是传统 MVC：核心是以生命周期和领域边界为核心的 Unity 分层组件架构；UI 局部采用 MVC/MVP 风格。</text>

  <rect x="1080" y="62" width="420" height="76" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1102" y="91" class="label">核心判断</text>
  <text x="1102" y="116" class="small">MVC 只描述 UI 的一部分，不描述整个游戏运行时。</text>

  <!-- UI local MVC/MVP -->
  <rect x="80" y="164" width="1440" height="270" rx="18" fill="url(#ui)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="204" class="section">UI 子系统：局部采用 MVC / MVP 风格</text>
  <text x="112" y="230" class="small">UI Controller / Presenter 负责协调，View 负责显示，业务规则仍由 UseCase、Gateway 和领域服务拥有。</text>

  <rect x="126" y="272" width="330" height="112" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="154" y="308" class="label">Model / State</text>
  <text x="154" y="334" class="body">RunData、MetaData、Combat 状态</text>
  <text x="154" y="358" class="body">Localization 数据、领域事件</text>

  <rect x="635" y="272" width="330" height="112" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="663" y="308" class="label">Controller / Presenter</text>
  <text x="663" y="334" class="body">UI Controller、UseCase</text>
  <text x="663" y="358" class="body">接收输入、绑定状态、转发操作</text>

  <rect x="1144" y="272" width="330" height="112" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="1172" y="308" class="label">View</text>
  <text x="1172" y="334" class="body">UI Prefab、DialogueView、HUD</text>
  <text x="1172" y="358" class="body">可替换布局、文本和本地化绑定</text>

  <path d="M456 328 H625" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M965 328 H1134" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1144 405 C1000 430 780 430 635 405" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="506" y="315" class="arrow-label">状态绑定 / 查询</text>
  <text x="1010" y="315" class="arrow-label">显示数据</text>
  <text x="790" y="422" class="arrow-label">用户输入 / 操作请求</text>

  <rect x="110" y="398" width="330" height="24" rx="12" fill="#fde68a"/>
  <text x="275" y="415" text-anchor="middle" class="pill">UI 的 MVC 边界</text>
  <rect x="1160" y="398" width="282" height="24" rx="12" fill="#fed7aa"/>
  <text x="1301" y="415" text-anchor="middle" class="pill">不是业务规则的唯一归属</text>

  <!-- Core architecture -->
  <rect x="80" y="470" width="1440" height="430" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="112" y="510" class="section">整体运行时：分层组件化领域架构</text>
  <text x="112" y="536" class="small">依赖方向由 asmdef、Contracts、Gateway、事件和生命周期 owner 共同约束。</text>

  <rect x="126" y="570" width="1348" height="92" rx="14" fill="url(#domain)" stroke="#0f766e" stroke-width="2"/>
  <text x="158" y="605" class="label">内容与表现层</text>
  <text x="158" y="633" class="body">Player · Enemies · Weapons · Items · Rooms · UI · Dialogue · Prefab · Scene · Animator</text>
  <text x="1120" y="605" class="small">变化最快</text>
  <text x="1120" y="630" class="tiny">不能成为基础设施</text>

  <path d="M800 662 V688" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="681" class="arrow-label">依赖稳定协议与服务</text>

  <rect x="126" y="700" width="1348" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="158" y="735" class="label">领域运行时层</text>
  <text x="158" y="763" class="body">Combat · Meta · Persistence · Flow · Camera · Projectiles · StateMachine · Runtime · Audio</text>
  <text x="1120" y="735" class="small">规则与编排</text>
  <text x="1120" y="760" class="tiny">由明确 owner 管理生命周期</text>

  <path d="M800 792 V818" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="811" class="arrow-label">依赖稳定合同</text>

  <rect x="126" y="830" width="1348" height="48" rx="14" fill="url(#foundation)" stroke="#7c3aed" stroke-width="2"/>
  <text x="158" y="860" class="label">稳定基础层</text>
  <text x="370" y="860" class="body">Contracts · Event payloads · Value types · Timer · Pool · Logging · 基础状态机语义</text>
  <text x="1120" y="860" class="small">变化最慢</text>

  <!-- lifecycle and data notes -->
  <rect x="112" y="930" width="660" height="52" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="136" y="962" class="body">生命周期 owner：Initializer → Persistent → GameManager → Scene / Room → Actor</text>
  <rect x="808" y="930" width="664" height="52" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <text x="832" y="962" class="body">数据边界：SO 配置 ≠ 运行时状态 ≠ Save / Meta 存档状态</text>

  <!-- legend -->
  <circle cx="116" cy="1000" r="7" fill="#d97706"/>
  <text x="132" y="1005" class="tiny">局部 MVC/MVP</text>
  <circle cx="286" cy="1000" r="7" fill="#2563eb"/>
  <text x="302" y="1005" class="tiny">领域运行时</text>
  <circle cx="438" cy="1000" r="7" fill="#7c3aed"/>
  <text x="454" y="1005" class="tiny">稳定基础</text>
  <text x="1180" y="1005" class="tiny">Zephyr Architecture · 2026-10-19</text>
</svg>
